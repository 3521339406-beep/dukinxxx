<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="一天一页，专注当下。只保存在你设备上的个人计划。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./styles.css"><title>日序 · 个人计划</title></head>
<body><div class="shell"><header class="brand"><a href="#" aria-label="日序首页"><span class="brand-icon">▦</span>日序<span class="brand-sub">PERSONAL PLANNER</span></a><button id="settings" class="icon-button" aria-label="设置与导出">···</button></header><main id="app"></main><footer>一天一页，专注当下。<span>仅保存在此设备</span></footer></div>
<div id="error" role="alert" hidden></div><div id="toasts" aria-live="polite"></div>
<dialog id="task-dialog" aria-labelledby="modal-title"><form id="task-form"><div class="sheet-bar"></div><div class="modal-head"><button type="button" id="cancel-task" class="text-button">取消</button><h2 id="modal-title">添加任务</h2><button type="submit" class="text-button strong">保存</button></div><p id="modal-date"></p><label for="task-name">任务名称</label><textarea id="task-name" rows="3" placeholder="想做些什么？" required></textarea><p id="form-error" role="alert"></p></form></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="modal-head"><h2 id="settings-title">设置</h2><button id="close-settings" class="text-button">完成</button></div><section class="settings-section"><h3>你的计划，只属于你</h3><p>数据即时保存在当前浏览器，不会上传到云端。清除浏览器数据会移除计划，请定期导出备份。</p><button id="export" class="primary full">导出全部数据 · JSON</button><p class="small">将导出的 JSON 文件传到另一台设备，即可导入计划。</p><button id="import" class="primary full">导入数据 · JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden><div id="import-preview" hidden><p id="import-summary"></p><button id="confirm-import" class="primary full">确认替换并导入</button><button id="cancel-import" class="text-button full">取消</button></div><p id="import-status" role="status" aria-live="polite"></p><button id="export-backup" class="text-button full" hidden>下载导入前备份</button></section><section class="settings-section"><h3>添加到主屏幕</h3><p>在 iPhone Safari 中打开网站，点击“分享”，再选择“添加到主屏幕”。首次完整打开后可离线使用。</p><p id="offline-status" class="small"></p><button id="install" class="primary full" hidden>安装日序</button></section><p class="version">日序 V1.1 · 简单地计划每一天</p></dialog>
<script type="module" src="./src/app.js"></script></body></html>
